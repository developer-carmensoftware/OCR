[pytest]
asyncio_mode = auto
# Windows: starlette TestClient's internal event loop (via anyio) closes OS
# handles during teardown, corrupting both fd-level (NamedTemporaryFile) and
# sys-level (StringIO buffer) capture between tests. Disable capture entirely.
addopts = --capture=no
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
markers =
    db_attempt_ok: allow this test to reach a real (unreachable-by-design) DB connect attempt — see tests/conftest.py's _fail_on_real_db_attempt
