[tool.bandit]
exclude_dirs = ["tests", "venv"]
skips = [
    "B104",  # binding to 0.0.0.0 — intentional for containerised deployment
    "B608",  # SQL injection false-positive on SQLAlchemy text() with bound params
]

[tool.ruff]
target-version = "py312"
line-length = 100
exclude = [
    "venv",
    "migrations",
    "scratch",
    ".git",
]

[tool.ruff.lint]
# E/W = pycodestyle, F = pyflakes, I = isort, UP = pyupgrade, B = bugbear
select = ["E", "W", "F", "I", "UP", "B"]
ignore = [
    "E501",   # line too long — formatter handles this
    "B008",   # do not perform function calls in default arguments (FastAPI Depends)
    "B904",   # raise from — too noisy for existing code
    "UP007",  # use X | Y for union types — keep Optional for readability
    "UP042",  # StrEnum — keep (str, Enum) for explicit readability
    "B905",   # zip strict= — not needed for internal data processing loops
]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# ── coverage ─────────────────────────────────────────────────────────────────
# pytest config lives in pytest.ini, NOT here — pytest.ini takes precedence over
# pyproject, so a second copy in this file would be silently dead config.
[tool.coverage.run]
source = ["app"]
omit = ["app/migrations/*", "*/scratch/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]

# ── mypy ─────────────────────────────────────────────────────────────────────
[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
warn_unused_configs = true
warn_unused_ignores = true
# Start lenient — tighten per module as coverage grows
check_untyped_defs = false

# Strict only on business logic layers — expand this list one module at a time.
# Target: full app/ coverage by end of v1.x.
# This list is the ONLY place the strict set is declared — CI runs plain `mypy app/`
# and lets these overrides decide. Don't re-list modules in ci.yml.
[[tool.mypy.overrides]]
module = [
    "app.services.ap_invoice_postprocess_service",
    "app.services.usage_service",
    "app.services.audit_service",
    "app.services.llm_service",
    "app.auth.session",
    "app.exceptions",
    "app.constants",
    "app.context",
    "app.config",
    "app.llm.client",
    "app.middleware.rate_limit",
    "app.middleware.performance",
]
check_untyped_defs = true
warn_return_any = true
