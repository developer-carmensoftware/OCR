# Render Infrastructure-as-Code
# Docs: https://render.com/docs/blueprint-spec
#
# Services in this Blueprint:
#   1. carmen-ocr-backend  — FastAPI (Python web service)
#   2. carmen-ocr-frontend — Vite SPA (static site, global CDN)
#   3. carmen-cron         — Cron job: all daily jobs (01:00 UTC)
#
# Deploy:
#   1. Push this repo to GitHub.
#   2. In Render dashboard → New → Blueprint → connect this repo.
#   3. Render auto-detects render.yaml and prompts for secret env vars.
#   4. Set DATABASE_URL (Neon), OPENROUTER_API_KEY, SESSION_ENCRYPTION_KEY,
#      MASTER_API_KEY.
#   5. After first deploy:
#        - Copy the static site URL into the backend's ALLOWED_ORIGINS.
#        - Copy the backend URL into VITE_API_BASE_URL for the static site.
#        - Copy the backend URL into BACKEND_URL for the cron services.
#      Both services then redeploy automatically.

services:
  # ════════════════════════════════════════════════════════════════════════════
  # Backend — FastAPI
  # ════════════════════════════════════════════════════════════════════════════
  - type: web
    name: carmen-ocr-backend
    runtime: python
    plan: free
    region: singapore
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/v1/health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: "3.12"

      # ── Database (Neon Postgres) ────────────────────────────────────────────
      - key: DATABASE_URL
        sync: false

      # ── LLM (OpenRouter) ────────────────────────────────────────────────────
      - key: OPENROUTER_API_KEY
        sync: false
      - key: OPENROUTER_BASE_URL
        value: https://openrouter.ai/api/v1
      - key: OPENROUTER_OCR_MODEL
        value: google/gemini-2.5-flash-lite
      - key: OPENROUTER_SUGGESTION_MODEL
        value: google/gemini-2.0-flash-lite
      - key: OPENROUTER_AP_INVOICE_MODEL
        value: google/gemini-2.5-flash-lite

      # ── Auth ────────────────────────────────────────────────────────────────
      - key: OCR_JWT_SECRET
        generateValue: true
      - key: SESSION_ENCRYPTION_KEY
        sync: false
      - key: MASTER_API_KEY
        sync: false

      # ── CORS ────────────────────────────────────────────────────────────────
      - key: ALLOWED_ORIGIN_REGEX
        value: ".*"

      # ── App ─────────────────────────────────────────────────────────────────
      - key: MAX_FILE_SIZE_MB
        value: "20"
      - key: LOG_JSON
        value: "true"

      # ── Observability (optional) ────────────────────────────────────────────
      - key: SENTRY_DSN
        sync: false
      - key: SENTRY_ENVIRONMENT
        value: production

  # ════════════════════════════════════════════════════════════════════════════
  # Frontend — Vite SPA
  # ════════════════════════════════════════════════════════════════════════════
  - type: web
    runtime: static
    name: carmen-ocr-frontend
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    autoDeploy: true
    pullRequestPreviewsEnabled: true
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
    envVars:
      - key: VITE_API_BASE_URL
        sync: false
      - key: VITE_SENTRY_ENV
        value: production
      - key: VITE_SENTRY_DSN
        sync: false

  # ════════════════════════════════════════════════════════════════════════════
  # Cron — All daily jobs (01:00 UTC)
  #   session purge → daily summary → model cost → monthly summary → anomaly → pricing sync
  # ════════════════════════════════════════════════════════════════════════════
  - type: cron
    name: carmen-cron
    runtime: go
    plan: free
    region: singapore
    rootDir: cron_service
    schedule: "0 1 * * *"
    buildCommand: go build -o cron .
    startCommand: ./cron
    envVars:
      - key: BACKEND_URL
        sync: false
      - key: MASTER_API_KEY
        sync: false
