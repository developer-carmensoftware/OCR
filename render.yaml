# Render Infrastructure-as-Code
# Docs: https://render.com/docs/blueprint-spec
#
# Services in this Blueprint:
#   1. carmen-ocr-backend  — FastAPI (Python web service)
#   2. carmen-ocr-frontend — Vite SPA (static site, global CDN)
#   3. carmen-cron         — Cron job: all daily jobs (01:00 UTC)
#
# Deploy:
#   1. Push this repo to GitHub.
#   2. In Render dashboard → New → Blueprint → connect this repo.
#   3. Render auto-detects render.yaml and prompts for secret env vars.
#   4. Set DATABASE_URL (Neon), OPENROUTER_API_KEY, SESSION_ENCRYPTION_KEY,
#      MASTER_API_KEY.
#   5. After first deploy:
#        - Copy the static site URL into the backend's ALLOWED_ORIGINS.
#        - Copy the backend URL into VITE_API_BASE_URL for the static site.
#        - Copy the backend URL into BACKEND_URL for the cron services.
#      Both services then redeploy automatically.

services:
  # ════════════════════════════════════════════════════════════════════════════
  # Backend — FastAPI
  # ════════════════════════════════════════════════════════════════════════════
  - type: web
    name: carmen-ocr-backend
    runtime: python
    plan: free
    region: singapore
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/v1/health
    # Deploy ordering is owned by .github/workflows/deploy.yml: it runs
    # `supabase db push` first, then fires this service's Render deploy hook.
    # Keep autoDeploy off so code never ships ahead of its migration.
    autoDeploy: false
    envVars:
      - key: PYTHON_VERSION
        value: "3.12"

      # ── Database (Neon Postgres) ────────────────────────────────────────────
      - key: DATABASE_URL
        sync: false

      # ── LLM (OpenRouter) ────────────────────────────────────────────────────
      - key: OPENROUTER_API_KEY
        sync: false
      - key: OPENROUTER_BASE_URL
        value: https://openrouter.ai/api/v1
      - key: OPENROUTER_OCR_MODEL
        value: google/gemini-2.5-flash-lite
      - key: OPENROUTER_SUGGESTION_MODEL
        value: google/gemini-2.0-flash-lite
      - key: OPENROUTER_AP_INVOICE_MODEL
        value: google/gemini-2.5-flash-lite

      # ── Auth ────────────────────────────────────────────────────────────────
      - key: OCR_JWT_SECRET
        generateValue: true
      # Separate signing key for admin JWTs — MUST differ from OCR_JWT_SECRET
      # (the app refuses to start in production if it is empty or equal to it).
      - key: ADMIN_JWT_SECRET
        generateValue: true
      - key: SESSION_ENCRYPTION_KEY
        sync: false
      - key: MASTER_API_KEY
        sync: false

      # ── CORS ────────────────────────────────────────────────────────────────
      # Set ALLOWED_ORIGINS to the exact frontend origin(s) after the static site
      # deploys, e.g. https://carmen-ocr-frontend.onrender.com (comma-separated for
      # multiple). NEVER use a wildcard regex — the app hard-fails on ".*" in prod.
      # ALLOWED_ORIGIN_REGEX is optional; use only a tightly-scoped pattern for
      # preview deploys (e.g. ^https://carmen-ocr-frontend-[a-z0-9]+\.onrender\.com$).
      - key: ALLOWED_ORIGINS
        sync: false
      - key: ALLOWED_ORIGIN_REGEX
        sync: false

      # ── SSRF allowlist ────────────────────────────────────────────────────────
      # Comma-separated Carmen host(s) (no scheme) permitted at /auth/exchange.
      # Pin your known Carmen ERP host(s), e.g. carmen.example.com
      - key: ALLOWED_CARMEN_HOSTS
        sync: false

      # ── App ─────────────────────────────────────────────────────────────────
      - key: MAX_FILE_SIZE_MB
        value: "20"
      - key: LOG_JSON
        value: "true"
      # Behind Render's load balancer — read the real client IP from the
      # proxy-appended end of X-Forwarded-For (see TRUSTED_PROXY_HOPS).
      - key: TRUST_PROXY
        value: "true"

      # ── Observability (optional) ────────────────────────────────────────────
      - key: SENTRY_DSN
        sync: false
      - key: SENTRY_ENVIRONMENT
        value: production

  # ════════════════════════════════════════════════════════════════════════════
  # Frontend — Vite SPA
  # ════════════════════════════════════════════════════════════════════════════
  - type: web
    runtime: static
    name: carmen-ocr-frontend
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    autoDeploy: true
    pullRequestPreviewsEnabled: true
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
    envVars:
      - key: VITE_API_BASE_URL
        sync: false
      - key: VITE_SENTRY_ENV
        value: production
      - key: VITE_SENTRY_DSN
        sync: false

  # ════════════════════════════════════════════════════════════════════════════
  # Cron — All daily jobs (01:00 UTC)
  #   session purge → daily summary → model cost → monthly summary → anomaly → pricing sync
  # ════════════════════════════════════════════════════════════════════════════
  - type: cron
    name: carmen-cron
    runtime: go
    plan: free
    region: singapore
    rootDir: cron_service
    schedule: "0 1 * * *"
    buildCommand: go build -o cron .
    startCommand: ./cron
    envVars:
      - key: BACKEND_URL
        sync: false
      - key: MASTER_API_KEY
        sync: false
