# Render Infrastructure-as-Code
# Docs: https://render.com/docs/blueprint-spec
#
# Services in this Blueprint:
#   1. carmen-ocr-backend — FastAPI (Python web service)
#
# Deploy:
#   1. Push this repo to GitHub.
#   2. In Render dashboard → New → Blueprint → connect this repo.
#   3. Render auto-detects render.yaml and prompts for secret env vars.
#   4. Set DATABASE_URL (Supabase pooler), OPENROUTER_API_KEY, SESSION_ENCRYPTION_KEY,
#      ALLOWED_ORIGINS, ALLOWED_CARMEN_HOSTS.

services:
  # ════════════════════════════════════════════════════════════════════════════
  # Backend — FastAPI
  # ════════════════════════════════════════════════════════════════════════════
  - type: web
    name: carmen-ocr-backend
    runtime: python
    plan: free
    region: singapore
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/v1/health
    # Deploy ordering is owned by .github/workflows/deploy.yml: it runs
    # `supabase db push` first, then fires this service's Render deploy hook.
    # Keep autoDeploy off so code never ships ahead of its migration.
    autoDeploy: false
    envVars:
      - key: PYTHON_VERSION
        value: "3.12"

      # ── Database (Supabase Postgres via Supavisor pooler) ──────────────────
      - key: DATABASE_URL
        sync: false

      # ── LLM (OpenRouter) ────────────────────────────────────────────────────
      - key: OPENROUTER_API_KEY
        sync: false
      - key: OPENROUTER_BASE_URL
        value: https://openrouter.ai/api/v1
      - key: OPENROUTER_OCR_MODEL
        value: google/gemini-2.5-flash-lite
      - key: OPENROUTER_SUGGESTION_MODEL
        value: google/gemini-2.0-flash-lite
      - key: OPENROUTER_AP_INVOICE_MODEL
        value: google/gemini-2.5-flash-lite

      # ── Auth ────────────────────────────────────────────────────────────────
      - key: OCR_JWT_SECRET
        generateValue: true
      # Separate signing key for admin JWTs — MUST differ from OCR_JWT_SECRET
      # (the app refuses to start in production if it is empty or equal to it).
      - key: ADMIN_JWT_SECRET
        generateValue: true
      - key: SESSION_ENCRYPTION_KEY
        sync: false

      # ── CORS ────────────────────────────────────────────────────────────────
      # Set ALLOWED_ORIGINS to the exact frontend origin(s), comma-separated.
      # NEVER use a wildcard regex — the app hard-fails on ".*" in prod.
      # ALLOWED_ORIGIN_REGEX is optional; use only a tightly-scoped pattern for
      # preview deploys (e.g. ^https://carmen-ocr-frontend-[a-z0-9]+\.onrender\.com$).
      - key: ALLOWED_ORIGINS
        sync: false
      - key: ALLOWED_ORIGIN_REGEX
        sync: false

      # ── SSRF allowlist ────────────────────────────────────────────────────────
      # Comma-separated Carmen host(s) (no scheme) permitted at /auth/exchange.
      # Pin your known Carmen ERP host(s), e.g. carmen.example.com
      - key: ALLOWED_CARMEN_HOSTS
        sync: false

      # ── OneApp FileService (payment-slip storage) ─────────────────────────────
      # Required by the purchase flow: without these, slip upload fails with a 502
      # (storage_service raises StorageError when unconfigured).
      - key: FILE_SERVICE_URL
        sync: false
      - key: FILE_SERVICE_API_KEY
        sync: false

      # ── Carmen AR posting (admin order review → ERP) ──────────────────────────
      - key: CARMEN_AR_URL
        sync: false
      - key: CARMEN_AR_TOKEN
        sync: false

      # ── Scheduled jobs (pg_cron → pg_net → this service) ──────────────────────
      # Shared secret for maintenance endpoints (/admin/anomaly/run, /admin/pricing/sync).
      # MUST be set, and MUST equal the Supabase Vault secret named 'internal_job_token'
      # — an empty value makes require_maintenance_auth reject every cron call with 401,
      # silently disabling anomaly/budget detection and model-pricing refresh.
      # Generate: python -c "import secrets; print(secrets.token_hex(32))"
      - key: INTERNAL_JOB_TOKEN
        sync: false

      # ── Observability ─────────────────────────────────────────────────────────
      # Without a DSN, Sentry no-ops and 5xx are only visible in Render's logs
      # (which are lost on spin-down) — set this before opening to real users.
      - key: SENTRY_DSN
        sync: false
      - key: SENTRY_ENVIRONMENT
        value: production

      # ── App ─────────────────────────────────────────────────────────────────
      # Explicitly off: app_debug is the ONLY production switch — it gates the
      # weak-secret rejection, the wildcard-CORS hard-fail, admin/OCR key separation,
      # and traceback leakage. It already defaults to false; pinned here so an
      # inherited APP_DEBUG=true can never silently disarm all of them.
      - key: APP_DEBUG
        value: "false"
      - key: MAX_FILE_SIZE_MB
        value: "5"
      # Code default is 0.5h; 8h matches .env.example and keeps a user from losing
      # in-progress wizard work to a mid-session expiry.
      # Changing this needs a matching migration: fn_purge_inactive_sessions() scrubs
      # the session (is_active=false) at created_at + this value, hardcoded in SQL.
      - key: SESSION_TTL_HOURS
        value: "8"
      - key: LOG_JSON
        value: "true"
      # Behind Render's load balancer — read the real client IP from the
      # proxy-appended end of X-Forwarded-For (see TRUSTED_PROXY_HOPS).
      - key: TRUST_PROXY
        value: "true"
