# Render Infrastructure-as-Code
# Docs: https://render.com/docs/blueprint-spec
#
# Two services in one Blueprint:
#   1. carmen-ocr-backend  — FastAPI (Python web service, free plan)
#   2. carmen-ocr-frontend — Vite SPA (static site, free plan, global CDN)
#
# Deploy:
#   1. Push this repo to GitHub.
#   2. In Render dashboard → New → Blueprint → connect this repo.
#   3. Render auto-detects render.yaml and prompts for secret env vars.
#   4. Set DATABASE_URL (Neon), OPENROUTER_API_KEY, SESSION_ENCRYPTION_KEY.
#   5. After first deploy:
#        - Copy the static site URL into the backend's ALLOWED_ORIGINS.
#        - Copy the backend URL into VITE_API_BASE_URL for the static site.
#      Both services then redeploy automatically.
#
# Keep-alive: Render free web services sleep after ~15 minutes of no traffic.
#   Configure UptimeRobot to ping https://<backend>.onrender.com/api/v1/health
#   every 5 minutes to keep background schedulers running.
#   Static sites do NOT sleep — no keep-alive needed for the frontend.

services:
  - type: web
    name: carmen-ocr-backend
    runtime: python
    plan: free
    region: singapore
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/v1/health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: "3.12"

      # ── Database (Neon Postgres) ────────────────────────────────────────────
      # Get this from Neon dashboard → Connection Details → Pooled connection.
      # The app auto-normalizes `postgres://` → `postgresql+asyncpg://`.
      - key: DATABASE_URL
        sync: false

      # ── LLM (OpenRouter) ────────────────────────────────────────────────────
      - key: OPENROUTER_API_KEY
        sync: false
      - key: OPENROUTER_BASE_URL
        value: https://openrouter.ai/api/v1
      - key: OPENROUTER_OCR_MODEL
        value: google/gemini-2.5-flash-lite
      - key: OPENROUTER_SUGGESTION_MODEL
        value: google/gemini-2.0-flash-lite
      - key: OPENROUTER_AP_INVOICE_MODEL
        value: google/gemini-2.5-flash-lite

      # ── Auth ────────────────────────────────────────────────────────────────
      - key: OCR_JWT_SECRET
        generateValue: true
      # Generate locally: python -c "from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())"
      - key: SESSION_ENCRYPTION_KEY
        sync: false

      # ── CORS ────────────────────────────────────────────────────────────────
      # ALLOWED_ORIGINS: comma-separated. Set to the static-site URL after the
      #   first deploy (e.g. https://carmen-ocr-frontend.onrender.com).
      # The regex below auto-permits any onrender.com / vercel.app subdomain
      # so preview deploys (e.g. PR previews) work without extra config.
      - key: ALLOWED_ORIGINS
        sync: false
      - key: ALLOWED_ORIGIN_REGEX
        value: ^https://[a-z0-9-]+\.(onrender\.com|vercel\.app)$

      # ── Render free-tier flags ──────────────────────────────────────────────
      # Ephemeral filesystem: skip on-disk archive directory creation, log a
      # warning that background schedulers need an external keep-alive ping.
      - key: EPHEMERAL_FILESYSTEM
        value: "true"
      # Disable nightly retention archive (no persistent disk for CSVs).
      - key: RETENTION_ENABLED
        value: "false"

      # ── App ─────────────────────────────────────────────────────────────────
      - key: MAX_FILE_SIZE_MB
        value: "20"
      - key: LOG_JSON
        value: "true"

      # ── Observability (optional) ────────────────────────────────────────────
      - key: SENTRY_DSN
        sync: false
      - key: SENTRY_ENVIRONMENT
        value: production

  # ════════════════════════════════════════════════════════════════════════════
  # Frontend — Vite SPA served as a static site on Render's global CDN.
  # Free plan: unlimited requests, 100 GB bandwidth/month, never sleeps.
  # ════════════════════════════════════════════════════════════════════════════
  - type: web
    runtime: static
    name: carmen-ocr-frontend
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    autoDeploy: true
    pullRequestPreviewsEnabled: true
    # SPA fallback — any unknown path serves index.html so the client-side
    # router can pick it up. Required because Vite produces a single HTML.
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      # Hash-based asset filenames mean we can cache aggressively.
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
    envVars:
      # Set this to the backend URL after first deploy, e.g.
      #   https://carmen-ocr-backend.onrender.com
      # Vite bakes the value into the bundle at build time, so any change
      # requires a frontend rebuild (Render's auto-deploy handles that).
      - key: VITE_API_BASE_URL
        sync: false
      - key: VITE_SENTRY_ENV
        value: production
      - key: VITE_SENTRY_DSN
        sync: false
