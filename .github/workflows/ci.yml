name: CI

on:
  push:
    branches: ["main", "dev"]
  pull_request:
    branches: ["main"]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # ── Backend: lint + type-check + tests + coverage ───────────────────────────
  backend:
    name: Backend (Python)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check app/ tests/

      - name: Format check (ruff)
        run: ruff format --check app/ tests/

      - name: Type check (mypy)
        run: |
          mypy app/tools/ \
               app/services/ap_invoice_postprocess_service.py \
               app/services/usage_service.py \
               app/services/audit_service.py \
               app/services/llm_service.py \
               app/auth/session.py \
               app/exceptions.py \
               app/constants.py \
               app/context.py \
               app/config.py \
               app/llm/client.py \
               app/middleware/rate_limit.py \
               app/middleware/performance.py
        continue-on-error: true   # informational until strict coverage grows

      - name: Security scan (bandit)
        run: bandit -c pyproject.toml -r app/ -ll
        # -ll = medium + high severity only; low-severity findings are noise at this stage

      - name: Test + coverage
        run: |
          pytest tests/ -q --tb=short \
            --cov=app --cov-report=term-missing \
            --cov-fail-under=50
        env:
          # Dummy values — tests mock all external calls, no real DB/LLM needed.
          # APP_DEBUG=true prevents weak-secret RuntimeError (acceptable in CI).
          APP_DEBUG: "true"
          DATABASE_URL: mysql+aiomysql://root:password@localhost:3306/carmen_ai
          OCR_JWT_SECRET: ci-test-secret-not-used-in-tests
          SESSION_ENCRYPTION_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
          OPENROUTER_API_KEY: sk-or-test-not-real

  # ── Frontend: lint + tests ───────────────────────────────────────────────────
  frontend:
    name: Frontend (Node)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Lint (eslint)
        run: npm run lint

      - name: Format check (prettier)
        run: npm run format:check

      - name: Type check (tsc)
        run: npm run type-check

      - name: Test (vitest)
        run: npm run test

  # ── Docker build check ───────────────────────────────────────────────────────
  docker:
    name: Docker build
    runs-on: ubuntu-latest
    # Only runs when Dockerfile or deps change — skip on docs-only PRs
    if: |
      contains(github.event.head_commit.modified, 'backend/') ||
      contains(github.event.head_commit.modified, 'frontend/') ||
      github.event_name == 'pull_request'

    steps:
      - uses: actions/checkout@v7

      - name: Build backend image
        run: docker build ./backend --tag carmen-backend:ci

      - name: Build frontend image
        run: docker build ./frontend --tag carmen-frontend:ci
