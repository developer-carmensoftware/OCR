name: CI

on:
  push:
    branches: ["main", "dev"]
  pull_request:
    branches: ["main"]

# Least privilege: jobs only read the repo. (codeql.yml requests its own write scope.)
permissions:
  contents: read

# Cancel superseded runs on the same ref — faster feedback, fewer wasted minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # ── Backend: lint + type-check + tests + coverage ───────────────────────────
  backend:
    name: Backend (Python)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check app/ tests/

      - name: Format check (ruff)
        run: ruff format --check app/ tests/

      # The strict-module list lives in pyproject.toml's [[tool.mypy.overrides]] — do
      # NOT re-list paths here. A hand-written list drifted from pyproject and ended up
      # pointing at app/tools/, which no longer exists; continue-on-error hid the
      # resulting path error, so this step reported nothing for months.
      #
      # Current baseline: ~50 errors, the large majority `Column[...]` false positives
      # from SQLAlchemy 1.x-style `Column()` model declarations. Clearing those means
      # migrating app/models/ to 2.0 `Mapped[]` annotations — worth doing, not here.
      - name: Type check (mypy)
        run: mypy app/
        continue-on-error: true   # informational until the models are annotated

      - name: Security scan (bandit)
        run: bandit -c pyproject.toml -r app/ -ll
        # -ll = medium + high severity only; low-severity findings are noise at this stage

      # Floor, not a target. Measured 76% on 2026-08-18 after backfilling the
      # untested services; set 4 points below that so routine PRs do not fail on
      # platform coverage variance. Raise it when the real number moves up.
      - name: Test + coverage
        run: |
          pytest tests/ -q --tb=short \
            --cov=app --cov-report=term-missing \
            --cov-fail-under=72
        env:
          # Dummy values — tests mock all external calls, no real DB/LLM needed.
          # APP_DEBUG=true prevents weak-secret RuntimeError (acceptable in CI).
          APP_DEBUG: "true"
          DATABASE_URL: postgresql+asyncpg://postgres:password@localhost:5432/postgres
          OCR_JWT_SECRET: ci-test-secret-not-used-in-tests
          SESSION_ENCRYPTION_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
          OPENROUTER_API_KEY: sk-or-test-not-real

  # ── Frontend: lint + tests ───────────────────────────────────────────────────
  frontend:
    name: Frontend (Node)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Lint (eslint)
        run: npm run lint

      - name: Format check (prettier)
        run: npm run format:check

      - name: Type check (tsc)
        run: npm run type-check

      - name: Test (vitest)
        run: npm run test

      # The production bundle is what Vercel actually ships. tsc/vitest do not exercise
      # the Vite/Rolldown + PostCSS pipeline, so a build-only break (PostCSS plugin,
      # bundler config, CSS layer) would otherwise surface at deploy time, not on the PR.
      - name: Build (vite)
        run: npm run build

  # ── DB migrations: apply schemas + migrations + seed on the real Supabase stack ─
  migrations-validate:
    name: Migrations (Supabase)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: supabase/setup-cli@v3
        with:
          version: latest

      # `supabase db reset` boots the bundled Supabase Postgres (ships pg_cron,
      # pgvector, partitioning) and applies schemas/ + migrations/ + seed. Fails
      # on any broken DDL — catches migration errors before they reach staging.
      - name: Apply migrations on ephemeral DB
        run: |
          supabase start
          supabase db reset

  # ── Secret scanning ───────────────────────────────────────────────────────────
  # Run the gitleaks binary directly. The gitleaks-action wrapper requires a paid
  # license for GitHub organizations; the binary itself is free/open-source.
  gitleaks:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install gitleaks
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz" \
            | tar -xz -C /usr/local/bin gitleaks
      # Scan the working tree (not full git history) — catches secrets in the
      # current code without re-flagging historical test fixtures on every run.
      - name: Scan
        run: gitleaks dir . --config .gitleaks.toml --redact --no-banner -v

  # ── Changelog hygiene ─────────────────────────────────────────────────────────
  # Per CLAUDE.md every meaningful change is logged in changelog/. Fail PRs that
  # touch no changelog file. Escape hatch: add the `skip-changelog` label.
  changelog-check:
    name: Changelog touched
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Require a changelog/ change
        if: ${{ !contains(github.event.pull_request.labels.*.name, 'skip-changelog') }}
        run: |
          base="origin/${{ github.base_ref }}"
          git fetch --no-tags --depth=1 origin "${{ github.base_ref }}"
          if git diff --name-only "$base"...HEAD | grep -q '^changelog/'; then
            echo "changelog/ updated ✔"
          else
            echo "::error::No changelog/ file changed. Add an entry to changelog/$(date +%F).md or apply the 'skip-changelog' label."
            exit 1
          fi
