version: 2

updates:
  # ── GitHub Actions ───────────────────────────────────────────────────────────
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "ci"
    labels: ["dependencies", "github-actions", "skip-changelog"]
    groups:
      actions:
        patterns: ["*"]

  # ── Python (backend) ─────────────────────────────────────────────────────────
  - package-ecosystem: pip
    directory: /backend
    schedule:
      interval: weekly
    commit-message:
      prefix: "deps(backend)"
    labels: ["dependencies", "python", "skip-changelog"]
    groups:
      fastapi-stack:
        patterns: ["fastapi", "uvicorn", "starlette", "pydantic*"]
      sqlalchemy-stack:
        patterns: ["sqlalchemy", "asyncpg"]
      test-tools:
        patterns: ["pytest*", "httpx", "anyio"]
      backend-minor:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  # ── JavaScript (frontend) ────────────────────────────────────────────────────
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    commit-message:
      prefix: "deps(frontend)"
    labels: ["dependencies", "javascript", "skip-changelog"]
    groups:
      react:
        patterns: ["react", "react-dom"]
      vite-stack:
        patterns: ["vite", "@vitejs/*"]
      test-tools:
        patterns: ["vitest", "@vitest/*", "@testing-library/*"]
      frontend-minor:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    ignore:
      # TS 7's stable programmatic API lands in 7.1; typescript-eslint has no
      # released support yet (tracking issue #12518) and lint is a required
      # CI step. Remove once typescript-eslint publishes TS7 support.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
