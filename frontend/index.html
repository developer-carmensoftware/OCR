<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CARMEN CLOUD AI AUTOMATION</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Mono:ital,wght@0,300;0,400;0,500;1,300;1,400;1,500&family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&family=Sarabun:ital,wght@0,300;0,400;0,500;0,600;0,700;1,300;1,400;1,500;1,600;1,700&display=swap" rel="stylesheet">

  <style>
    /* ── Initial loading UI (visible before React mounts) ── */
    #app-loader {
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: flex;
      align-items: center;
      justify-content: center;
      background-color: #eff0f5;
      background-image: radial-gradient(
        ellipse 70% 30% at 50% 0%,
        oklch(0.4714 0.1794 258.7 / 0.08) 0%,
        transparent 100%
      );
      transition: opacity 0.25s ease, visibility 0.25s ease;
    }
    #app-loader.done {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    /* Top progress bar */
    #app-loader-bar {
      position: fixed;
      top: 0;
      left: 0;
      height: 3px;
      width: 0%;
      background: linear-gradient(
        90deg,
        oklch(0.4714 0.1794 258.7),
        oklch(0.5852 0.1706 253.27)
      );
      border-radius: 0 99px 99px 0;
      box-shadow: 0 0 10px oklch(0.4714 0.1794 258.7 / 0.5);
      z-index: 10000;
      animation: loader-bar-grow 2.2s cubic-bezier(0.1, 0.6, 0.3, 1) forwards;
    }
    @keyframes loader-bar-grow {
      0%   { width: 0%; }
      60%  { width: 75%; }
      90%  { width: 88%; }
      100% { width: 88%; }
    }

    /* Center content: logo + spinner */
    #app-loader-center {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
      animation: loader-fade-in 0.4s ease both;
    }
    @keyframes loader-fade-in {
      from { opacity: 0; transform: translateY(8px); }
      to   { opacity: 1; transform: none; }
    }

    /* Wordmark */
    #app-loader-wordmark {
      font-family: 'DM Sans', 'Inter', -apple-system, sans-serif;
      font-size: 15px;
      font-weight: 600;
      letter-spacing: 0.08em;
      color: oklch(0.4714 0.1794 258.7);
      text-transform: uppercase;
      opacity: 0.9;
    }

    /* Ring spinner */
    #app-loader-ring {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      border: 2.5px solid oklch(0.4714 0.1794 258.7 / 0.15);
      border-top-color: oklch(0.4714 0.1794 258.7);
      animation: loader-spin 0.7s linear infinite;
    }
    @keyframes loader-spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
    <!-- Initial loading UI — removed by React after first paint -->
    <div id="app-loader-bar"></div>
    <div id="app-loader">
      <div id="app-loader-center">
        <div id="app-loader-ring"></div>
        <span id="app-loader-wordmark">Carmen Cloud</span>
      </div>
    </div>

    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
</body>
</html>
