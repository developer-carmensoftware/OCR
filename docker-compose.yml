services:
  backend:
    build: ./backend
    restart: unless-stopped
    ports:
      - "8010:8010"
    env_file: ./backend/.env
    volumes:
      - backend_uploads:/app/uploads
      - backend_exports:/app/exports
      - backend_archives:/app/archives
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8010/livez')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "3010:80"
    depends_on:
      - backend

  db:
    image: mariadb:11
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-changeme}
      MARIADB_DATABASE: carmen_ai
      MARIADB_CHARACTER_SET_SERVER: utf8mb4
      MARIADB_COLLATION_SERVER: utf8mb4_unicode_ci
    volumes:
      - db_data:/var/lib/mysql
    ports:
      - "3306:3306"   # remove in production (expose only to backend)
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  db_data:
  backend_uploads:
  backend_exports:
  backend_archives:
